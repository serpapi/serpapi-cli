name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.25 is the minimum in go.mod for go install users; stable builds the releases.
        go: ["1.25", stable]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "Run gofmt -w on: $unformatted"; exit 1; }
      - run: go vet ./...
      - run: go build ./cmd/serpapi
      - run: go test -race ./pkg/...

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
          check-latest: true
      # Fork PRs get no secrets, so only the offline contract tests run there.
      - name: Run E2E tests
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: go test -v ./tests/...
